<fieldset id="buildFilters80" class="build-filters80" hidden>
  <legend>施設を探す</legend>
  <div class="build-fields80">
    <label for="buildName80">施設名<input id="buildName80" type="search" placeholder="例：小鳥" autocomplete="off" enterkeyhint="search"></label>
    <label for="buildSize80">敷地<select id="buildSize80"><option value="">すべてのサイズ</option></select></label>
  </div>
  <div class="build-checks80">
    <label><input id="buildRoad80" type="checkbox"> 道の上に置ける</label>
    <label><input id="buildUnplaced80" type="checkbox"> 未設置のみ</label>
  </div>
  <div class="build-result80"><span id="buildCount80" role="status" aria-live="polite"></span>
    <button type="button" id="buildReset80">条件をリセット</button></div>
</fieldset>
