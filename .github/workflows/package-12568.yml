name: Verify 1.25.68 monster level cap and offline package
on:
  push:
    branches: [build/monster-level-1.25.68]
    paths: ['.github/workflows/package-12568.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            releases/1.25.67
            tools
            tests
      - name: Build and preflight
        run: python3 build.py
      - name: Run browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/mb" --no-save playwright@1.56.1
          "$RUNNER_TEMP/mb/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8879 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          NODE_PATH="$RUNNER_TEMP/mb/node_modules" node tests/v1.25.68-monster-level.cjs
      - name: Record verified distribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- game.html latest.json archive.html PROGRESS.md releases/1.25.68/
          git commit -m 'Build and verify 1.25.68 distribution [skip ci]'
          git push origin HEAD:refs/heads/build/monster-level-1.25.68
