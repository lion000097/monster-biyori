name: Package observation camera 1.25.93
on:
  push:
    branches: ['build/observation-camera-12593']
permissions:
  contents: write
jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game.html
            /latest.json
            /archive.html
            /tools/
            /work/scene-camera-12581/
            /work/observation-camera-12593/
            /releases/1.25.92/
            /releases/1.25.93/
      - run: |
          python work/observation-camera-12593/build_release.py
          python tools/release_preflight.py --root .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse game.html latest.json archive.html releases/1.25.93/
          git commit -m 'Package 1.25.93 browser and offline editions'
          git push origin HEAD:refs/heads/build/observation-camera-12593
