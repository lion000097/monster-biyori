name: Package retired buildings 1.25.95
on:
  push:
    branches: ['build/retired-buildings-12595']
permissions:
  contents: write
jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game.html
            /latest.json
            /archive.html
            /tools/
            /work/scene-camera-12581/
            /work/retired-buildings-12595/
            /releases/1.25.94/
            /releases/1.25.95/
      - run: |
          python work/retired-buildings-12595/build_release.py
          python tools/release_preflight.py --root .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse game.html latest.json archive.html releases/1.25.95/
          git commit -m 'Package 1.25.95 browser and offline editions'
          git push origin HEAD:refs/heads/build/retired-buildings-12595
