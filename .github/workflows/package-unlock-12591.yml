name: Package facility introductions 1.25.91
on:
  push:
    branches: ['build/facility-introductions-12591']
permissions:
  contents: write
jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game.html
            /latest.json
            /archive.html
            /tools/
            /work/scene-camera-12581/
            /work/unlock-12591/
            /releases/1.25.90/
            /releases/1.25.91/
      - run: |
          python work/unlock-12591/build.py
          python tools/release_preflight.py --root .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse game.html latest.json archive.html releases/1.25.91/
          git commit -m 'Package 1.25.91 and the verified offline update'
          git push origin HEAD:refs/heads/build/facility-introductions-12591
