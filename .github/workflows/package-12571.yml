name: Verify 1.25.71 adventure artwork
on:
  push:
    branches: [art/adventure-scenes-1.25.71]
    paths: ['.github/workflows/package-12571.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            assets/adventure
            releases/1.25.70
            releases/1.25.71
            tests
            tools
            work/1.25.71
      - name: Build both editions and verify every ZIP member
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/adventure-python"
          "$RUNNER_TEMP/adventure-python/bin/python" -m pip install -q Pillow
          "$RUNNER_TEMP/adventure-python/bin/python" work/1.25.71/build.py
      - name: Exercise adventure and raid views with a previous save
        run: |
          npm install --prefix "$RUNNER_TEMP/adventure-browser" --no-save playwright@1.56.1
          if command -v google-chrome >/dev/null; then export CHROMIUM="$(command -v google-chrome)"; else "$RUNNER_TEMP/adventure-browser/node_modules/.bin/playwright" install --with-deps chromium; fi
          NODE_PATH="$RUNNER_TEMP/adventure-browser/node_modules" node tests/v1.25.71-adventure-art.cjs
      - name: Store the verified release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- game.html latest.json archive.html PROGRESS.md releases/1.25.71/
          git commit -m 'Package and verify the 1.25.71 adventure artwork [skip ci]'
          git push origin HEAD:refs/heads/art/adventure-scenes-1.25.71
