name: Verify the 1.25.85 distribution
on:
  push:
    branches: ['build/town-foundations-1.25.85']
permissions:
  contents: write
jobs:
  distribution:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game.html
            /latest.json
            /archive.html
            /work/town-foundations-12585/package.py
            /work/town-foundations-12585/transfer/paintings.zlib
            /tools/release_preflight.py
            /releases/1.25.84/game.html
            /releases/1.25.84/monster-biyori-1.25.84.zip
            /releases/1.25.85/
      - name: Assemble the tested full-resolution game
        run: |
          set -eu
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import zlib
          src=Path('releases/1.25.84/game.html').read_text()
          assert src.count('1.25.84')==3
          src=src.replace('1.25.84','1.25.85').replace('建築15種の原画仕上げ</footer>','建築の土台と道の接地</footer>')
          start=src.index('const axisAtlas=')
          end=src.index('// END town illustration preload',start)
          block=zlib.decompress(Path('work/town-foundations-12585/transfer/paintings.zlib').read_bytes()).decode()
          body=(src[:start]+block+src[end:]).encode()
          assert sha256(body).hexdigest()=='e527581c57871e9fcabe1c2fd6df538353cdb8c9c9cb0050bd62cd002e0787a4'
          Path('game.html').write_bytes(body)
          Path('releases/1.25.85/game.html').write_bytes(body)
          PY
      - name: Package and verify the exact distribution
        run: |
          set -eu
          /usr/bin/python3 work/town-foundations-12585/package.py
          python3 tools/release_preflight.py --root .
          echo '3589e6afdfc4454aa4de14f238bb1e07712f95c79faf80063ab8b75e9cee407a  releases/1.25.85/monster-biyori-1.25.85.zip' | sha256sum -c -
      - name: Preserve tested files on the build branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse game.html archive.html latest.json releases/1.25.85/game.html releases/1.25.85/monster-biyori-1.25.85.zip
          git commit -m 'Verify and preserve the 1.25.85 distribution'
          git push origin HEAD:refs/heads/build/town-foundations-1.25.85
