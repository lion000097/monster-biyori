name: Verify the 1.25.83 distribution
on:
  push:
    branches: ['build/town-axis-1.25.83']
permissions:
  contents: write
jobs:
  distribution:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game.html
            /latest.json
            /archive.html
            /work/town-axis/package.py
            /tools/release_preflight.py
            /releases/1.25.82/monster-biyori-1.25.82.zip
            /releases/1.25.83/
      - name: Package the verified web and launcher editions
        run: |
          set -eu
          /usr/bin/python3 work/town-axis/package.py
          python3 tools/release_preflight.py --root .
          echo 'a19b1f92c8210c92a141c5abce4a04886deea2c775ded901dfa6d2a49d2cc7e6  releases/1.25.83/monster-biyori-1.25.83.zip' | sha256sum -c -
      - name: Preserve verified distribution on the build branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse archive.html latest.json releases/1.25.83/monster-biyori-1.25.83.zip
          git commit -m 'Verify and store the exact 1.25.83 distribution ZIP'
          git push origin HEAD:refs/heads/build/town-axis-1.25.83
