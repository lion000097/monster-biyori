name: Verify scene camera and play time 1.25.81
on:
  push:
    branches: [verify/scene-camera-1.25.81]
    paths:
      - '.github/workflows/verify-scene-camera-12581.yml'
      - 'work/scene-camera-12581/**'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game.html
            /latest.json
            /archive.html
            /tools/
            /assets/scene-camera/
            /work/scene-camera-12581/
            /releases/1.25.79/game.html
            /releases/1.25.80/
            /releases/1.25.81/
            /tests/v1.25.81-camera.cjs
            /tests/v1.25.80-notebook.cjs
      - uses: actions/checkout@v4
        with:
          repository: facebook/zstd
          ref: v1.5.7
          path: compression-tool
          persist-credentials: false
      - name: Compile the release compressor
        run: |
          make --silent -C compression-tool/programs -j4 zstd
          echo "$GITHUB_WORKSPACE/compression-tool/programs" >> "$GITHUB_PATH"
      - name: Build and verify both games and the ZIP
        run: |
          /usr/bin/python3 work/scene-camera-12581/build.py
          /usr/bin/python3 work/scene-camera-12581/package.py
          python3 tools/release_preflight.py --root .
      - name: Exercise camera, clock, save files and previous notebook/search behavior on desktop and mobile layouts
        run: |
          npm install --prefix "$RUNNER_TEMP/ranch-browser" --no-save --package-lock=false playwright@1.56.1
          export NODE_PATH="$RUNNER_TEMP/ranch-browser/node_modules"
          export CHROMIUM="$(command -v google-chrome)"
          node tests/v1.25.81-camera.cjs
          export RELEASE_ROOT="$RUNNER_TEMP/notebook-regression"
          mkdir -p "$RELEASE_ROOT/releases/1.25.80"
          ln -s "$PWD/game.html" "$RELEASE_ROOT/game.html"
          ln -s "$PWD/releases/1.25.81/launcher-game.html" "$RELEASE_ROOT/releases/1.25.80/launcher-game.html"
          node tests/v1.25.80-notebook.cjs
      - name: Save verified distribution to this branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --sparse game.html archive.html latest.json releases/1.25.81/game.html releases/1.25.81/launcher-game.html releases/1.25.81/monster-biyori-1.25.81.zip
          git commit -m 'Save the verified 1.25.81 web and offline distribution [skip ci]'
          git push origin HEAD:refs/heads/verify/scene-camera-1.25.81
