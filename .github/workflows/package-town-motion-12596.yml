name: Package town motion 1.25.96
on:
  push:
    branches: ['build/town-motion-12596']
    paths:
      - '.github/workflows/package-town-motion-12596.yml'
      - 'work/town-motion-12596/**'
      - 'releases/1.25.96/CHANGELOG.md'
      - 'releases/1.25.96/TESTING.md'
permissions:
  contents: write
jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game.html
            /archive.html
            /latest.json
            /tools/
            /work/scene-camera-12581/
            /work/town-monster-motion/
            /work/town-motion-12596/
            /releases/1.25.95/
            /releases/1.25.96/
      - name: Build web, single-file updater and offline ZIP
        run: |
          python -c 'from PIL import Image' || python -m pip install Pillow
          python work/town-motion-12596/build_release.py
          python tools/release_preflight.py --root .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse game.html latest.json archive.html releases/1.25.96/
          if ! git diff --cached --quiet; then
            git commit -m 'Package verified web game, 1.1.0 update and offline motion bank'
            git push origin HEAD:refs/heads/build/town-motion-12596
          fi
