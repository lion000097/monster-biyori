adventure.stage,times]);\n   }return JSON.stringify(outcomes);\n  } finally{Math.random=rng;}\n },\n expedition(){\n  state.speed=1;state.expeditionAuto213=true;state.expeditionArea213=3;const goal=expeditionGoal213(3);state.exploreProgress=goal-2;\n  const snapshot=()=>[state.coins,state.magic,state.exploreProgress,state.expeditionCounts213,state.expeditionTreasures,state.metrics.explore,state.expeditionLast137,state.treasures,state.treasureStock];\n  const native=Math.random;let times=0;Math.random=()=>{times++;return .5;};\n  try{const none=advanceExpedition(1,true),returned=advanceExpedition(2,true);return JSON.stringify([none,returned,times,snapshot()]);}\n  finally{Math.random=native;}\n },\n boss(target=30,ticket=.5){\n  state.adventure.stage=31;state.adventure.bossLoop=null;state.battle=null;selectedBattleStage=target;\n  const native=Math.random;let times=0;Math.random=()=>{times++;return ticket;};\n  try{\n   const gold=state.coins;startAdventure();state.battle.foes=[{...state.battle.foes[0],hp:1}];adventureTick(true);\n   return JSON.stringify([!!state.battle,state.adventure.stage,state.coins-gold,state.treasures,state.treasureStock,state.talentFruit,times]);\n  }finally{Math.random=native;}\n },\n rasters(){\n  zoom=1;cameraX=0;cameraY=0;drawWorld(1000);\n  const art=[canvas];\n  for(const m of state.monsters.slice(0,3))for(const shiny of [false,true])art.push(spriteMonster(m.kind,shiny),spriteMonsterHD(m.kind,shiny),spriteMonster64(m.kind,shiny));\n  return art;\n }\n};\n\nwindow.qaEquipmentRare=function(coreOnly=false){\n const check=(ok,msg)=>{if(!ok)throw Error(msg);};\n const SR=equipmentTypes12512.filter(id=>equipmentInfo12512[id].rarity==='SR');\n const SSR=equipmentTypes12512.filter(id=>equipmentInfo12512[id].rarity==='SSR');\n const R=equipmentTypes12512.filter(id=>equipmentInfo12512[id].rarity==='R');\n const all=[...SR,...SSR], boss50=SSR.find(id=>equipmentInfo12512[id].bossStage===50),boss25=SSR.find(id=>equipmentInfo12512[id].bossStage===25) ore+1,'one roll and strict upper bound for expedition route '+index);\n }\n check(rollB(25,.001)===null,'strict boss probability cutoff 0.1% on replay');\n const n=calls;check([5,10,15,20,30,31,35,40,45,55].every(stage=>rollB(stage,0)===null)&&calls===n,'normal, non-designated bosses, and bosses beyond area 10 are ineligible before any recipe is learned');\n const found=rollE(3,.009+.031*(3/23)-1e-8);\n check(SR.includes(found)&&hasEquipmentBlueprint12513(found)&&countEquipment12512(found)===0,'new SR recipe only, no inventory item');\n const learned=new Set([found]);\n for(let n=0;n<5;n++){\n  const count=calls,id=rollE(3,0);\n  check(SR.includes(id)&&!learned.has(id)&&hasEquipmentBlueprint12513(id)&&calls===count+1,'one unique remaining SR on a successful ticket');\n  learned.add(id);\n }\n check(rollE(3,0)===null,'all learned expedition blueprints do not duplicate');\n check(rollB(25,.001-1e-8)===boss25&&hasEquipmentBlueprint12513(boss25),'eligible already defeated boss blueprint at strict threshold');\n check(rollB(25,0)===null&&countEquipment12512(boss25)===0&&!hasEquipmentBlueprint12513(boss50),'already learned boss cannot duplicate, grant item, or leak to another boss');\n check(rollB(50,.001)===null&&rollB(50,0)===boss50&&countEquipment12512(boss50)===0,'10-5 grants its own star blueprint only');\n check(rollB(50,0)===null&&rollB(55,0)===null,'no duplicate 10-5 or additional SSR after area 10');\n renderUI(true);\n if(!coreOnly)check(all.every(id=>card(id)?.dataset.collected==='false'&&card(id).querySelector('[data-recipe=\"learned\"]')),'learning a recipe does not claim item collected');\n const savedBlueprints=JSON.stringify(state.equipmentBlueprints12513);\n check(save(true)&&load()&&JSON.stringify(state.equipmentBlueprints12513)===savedBlueprints,'all three recipes save and reload permanently');\n const before=state.charms;state.materialStock211[0]=750;ensureMaterials211();state.magic=500;\n state.equipmentStock12512=Object.fromEntries(equipmentTypes1251 ck used dew');\n  check(equipmentOpeningAttack12513(b,fighter)===1,'first-attack effect not repeatable within encounter');\n  b=duel('time',4,.8);adventureTick(true);\n  check(!b.equipmentOnce12513?.time,'time only triggers on round five');adventureTick(true);\n  check(b.equipmentOnce12513?.time&&b.log.includes('回復 +8'),'real fifth round adds recovery once');\n  b=duel('star',6,.65);adventureTick(true);check(!b.equipmentOnce12513?.star,'star not before round seven');\n  adventureTick(true);check(b.equipmentOnce12513?.star&&b.log.includes('回復 +18'),'real seventh round adds star recovery once');\n  b=duel('ice',1,.65);const native=Math.random;Math.random=()=>.05;\n  try{adventureTick(true);\n   check(b.equipmentOnce12513?.ice&&b.log.includes('回復 +17'),'ice adds +12 to ordinary level-20 support: '+JSON.stringify([b.log,b.equipmentOnce12513,fighter.lv]));\n   check(equipmentSupportHeal12513(b,fighter)===0,'ice never adds a second support boost');\n  }finally{Math.random=native;}\n } finally {Math.random=rng;}\n \n for(const [id,chance,power] of [['pin',.2,1.45],['obsidian',.12,1.75]]){\n  writeEquipment12512(fighter,id);\n  check(equipmentCritical12513(fighter,()=>chance)===1&&equipmentCritical12513(fighter,()=>chance-1e-8)===power,'exact critical rate and power '+id);\n  const test=(ticket)=>{\n   const bb=duel(id,1,1);let n=0;Math.random=()=>[.5,.5,ticket,.5][n++%4];\n   try{adventureTick(true);return [999999-bb.foes[0].hp,bb.log.includes('会心！'),n];}\n   finally{Math.random=rng;}\n  };\n  const off=test(chance),on=test(chance-1e-8);\n  check(on[0]>off[0]&&on[1]&&!off[1]&&on[2]===off[2],'actual ally turn critical split '+id);\n }\n for(const id of ['none','legacy','attack','shield','bell']){\n  writeEquipment12512(fighter,id);let draws=0;\n  check(equipmentCritical12513(fighter,()=>{draws++;return 0;})===1&&draws===0,'pre-existing item never consumes new crit RNG '+id);\n }\n};\n";

const mount=document.getElementById('mount'), result=document.getElementById('result'), run=document.getElementById('run');

async function read(path){const res=await fetch(path,{cache:'no-store'});check(res.ok,path+' HTTP '+res.status);return res.text();}
run.onclick=async()=>{
 const prefix='qa12513_'+crypto.randomUUID()+'_';
