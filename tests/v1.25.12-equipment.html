const hooks="\nwindow.qaEq={\n seed(){\n  state.speed=0;state.day=34;state.hour=13;state.ranchName='装備互換用の牧場';\n  state.coins=90909;state.food=378;state.magic=12.5;\n  state.adventure.stage=31;state.charms=5;state.craftProgress=17;state.treasures=[0,4];state.talentFruit=5;\n  state.party=state.monsters.slice(0,3).map(m=>m.id);state.monsters[0].equip=true;\n  state.buildings.push(...['woodFence','stoneWall','flowerGrassBlock'].filter(type=>B[type]).map((type,i)=>({id:state.nextId++,type,x:13+i,y:8,level:1,facing:i,constructionPaid:30})));\n  return save(true);\n },\n snapshot(){return JSON.stringify([state.ranchName,state.day,state.hour,state.speed,state.coins,state.food,state.magic,state.adventure.stage,state.charms,state.craftProgress,state.treasures,state.talentFruit,state.party,state.monsters.map(m=>[m.id,m.kind,m.lv,m.equip]),state.buildings,state.paths]);},\n ready(){return lionReady&&facilitySheetReady&&treeDecorationReady&&Object.values(ranchSheets130).every(a=>a.img.naturalWidth);},\n battle(){\n  const m=state.monsters[0];state.party=[m.id];state.adventure.stage=31;state.adventure.bossLoop=null;state.battle=null;\n  const rng=Math.random;Math.random=()=>.5;\n  try{ startAdventure();const b=state.battle;const max=b.ourMax,total=totalEnemyHp(b.foes);adventureTick(true);\n  return JSON.stringify([max,total,totalEnemyHp(b.foes),b.ourHp,b.round,state.adventure.stage]);}\n  finally{Math.random=rng;}\n },\n rasters(){\n  zoom=1;cameraX=0;cameraY=0;drawWorld(1000);\n  const art=[canvas];\n  for(const m of state.monsters.slice(0,3))for(const shiny of [false,true])art.push(spriteMonster(m.kind,shiny),spriteMonsterHD(m.kind,shiny),spriteMonster64(m.kind,shiny));\n  return art;\n }\n};\n\nwindow.qaEqProbe=function(){\n const check=(v,msg)=>{if(!v)throw Error(msg); };\n const types=['attack','shield','bell'];\n check(state.autoEquipment12512===false,'old save default auto off');\n check(totalEquipment12512()===5,'legacy exact surplus retained and included in aggregate');\n const [legacy,a,b]=state.monsters;\n check(a&&equipmentItem12512(a)==='none'&&legacy.equip,'legacy slot tracked separately from empty new slot');\n const stock=()=>state.equipmentStock12512;\n const eq=(m)=>m.equipment12512||'';\n state.equipmentStock12512={attack:2,shield:2,bell:2};state.charms=0;state.party=[legacy.id,a.id,b.id];\n const start=()=>{state.battle=null;selectedBattleStage=null;startAdventure();return state.battle; };\n check(start()?.stage===31&&!eq(a)&&!eq(b)&&totalEquipment12512()===6,'auto off is no-op even with reserves');\n state.battle=null;\n document.querySelector('[data-tab=\"adventure\"]').click();\n const toggle=document.querySelector('[data-equipment-auto12512]');\n check(toggle&&toggle.getAttribute('aria-pressed')==='false','opt-in control visibly defaults off');\n toggle.click();check(state.autoEquipment12512,'actual equipment checkbox enables opt in');\n // Ordinary tree/ranch redraw is not an adventure departure.\n renderUI(true);\n check(!eq(a)&&!eq(b)&&totalEquipment12512()===6,'no passive stock consumption outside departure');\n check(start()?.stage===31,'auto equip never delays battle startup');\n check(legacy.equip&&!eq(legacy)&&eq(a)&&eq(b)&&totalEquipment12512()===4,'equip only two empty slots, retain legacy');\n const equipped=[eq(a),eq(b)].join(',');\n autoEquipParty12512(crewParty());\n check([eq(a),eq(b)].join(',')===equipped&&totalEquipment12512()===4,'ongoing battle cannot swap or spend again');\n state.battle=null;\n check(start()&&[eq(a),eq(b)].join(',')===equipped&&totalEquipment12512()===4,'next departure cannot replace occupied slots');\n state.battle=null;\n state.equipmentStock12512={attack:0,shield:0,bell:0};state.charms=0;\n b.equip=false;delete b.equipment12512;\n check(start()&&!eq(b),'empty inventory does not delay or block departure');\n state.battle=null;\n state.autoEquipment12512=false;\n state.equipmentStock12512={attack:1,shield:1,bell:1 };\n openMonsterDetails(b.id,canvas);\n const manual=document.querySelector('[data-equipment-choice12512=\"bell\"][data-id=\"'+b.id+'\"]');\n check(manual&&!manual.disabled,'actual monster equipment button available');\n manual.click();\n check(eq(b)==='bell'&&stock().bell===0&&b.equip,'manual single slot consumes one');\n check(totalEquipment12512()===2,'reserve total excludes equipped pieces');\n state.charms=5;\n state.equipmentStock12512={attack:0,shield:0,bell:0};\n state.materialStock211[0]=250;ensureMaterials211();state.magic=90;state.craftProgress=0;state.equipmentCraft12512=0;\n const beforeMaterials=spendableStock(), beforeMagic=state.magic;\n const callCraft=()=>advanceWorkshopEquipment12512(1,true);\n for(let i=0;i<540;i++)callCraft();\n check(types.every(id=>stock()[id]===3),'actual funded production reaches three reserves for each of three types');\n check(state.charms===5&&spendableStock()===beforeMaterials-54&&state.magic===beforeMagic-13.5,'nine recipes consume exact inputs, ignoring five legacy charms');\n state.craftProgress=31.5;\n const scratch=JSON.stringify([stock(),state.craftProgress,state.magic,state.materialStock211]);\n for(let i=0;i<10;i++)callCraft();\n check(JSON.stringify([stock(),state.craftProgress,state.magic,state.materialStock211])===scratch,'full racks pause part-complete recipe, no spend');\n stock().attack=4;stock().bell=2;const materials=spendableStock(), magic=state.magic;\n callCraft();\n check(stock().attack===4&&stock().shield===3&&stock().bell===3&&state.charms===5,'refill exclusively deficient bell, while preserving surplus attack and unrelated old stock');\n check(spendableStock()===materials-6&&state.magic===magic-1.5&&state.craftProgress===0,'exactly one recipe when one slot missing');\n check(save(true)&&load(),'new equipment persistence');\n check(state.monsters.find(m=>m.id===b.id).equipment12512==='bell'&&stock().attack===4&&stock().shield===3&&stock().bell===3&&state.charms===5&&!state.autoEquipment12512,'load retains equipped bell, per-type reserves and excess');\n const fighter=state.monsters[0];fighter.lv=20;state.party=[fighter.id];\n function combat(item){\n  writeEquipment12512(fighter,item);const stateBattle=start();\n  const foe=stateBattle.foes[0];stateBattle.foes=[{...foe,atk:100,hp:999,maxHp:999,boss:false}];\n  const rng=Math.random;Math.random=()=>0.05;\n  try{adventureTick(true);}finally{Math.random=rng;}\n  return {hp:stateBattle.ourMax,remaining:stateBattle.ourHp,damage:999-stateBattle.foes[0].hp,log:stateBattle.log};\n }\n const no=combat('none'), atk=combat('attack'), def=combat('shield'), heal=combat('bell');\n check(atk.damage>no.damage&&atk.hp===no.hp+10,'actual ally turns apply attack equipment');\n check(def.remaining-def.hp>no.remaining-no.hp,'actual incoming attack reduced by defensive item');\n check(heal.remaining-heal.hp===no.remaining-no.hp+4&&/回復/.test(heal.log),'actual support recovery +4');\n check(def.damage===heal.damage&&atk.damage>=def.damage,'role distinctions retain expected modifiers');\n};\n";

const mount=document.getElementById('mount'), result=document.getElementById('result'), run=document.getElementById('run');
const check=(v,m)=>{if(!v)throw Error(m);};
async function read(path){const res=await fetch(path,{cache:'no-store'});check(res.ok,path+' HTTP '+res.status);return res.text();}
run.onclick=async()=>{
 const prefix='qa12512_'+crypto.randomUUID()+'_';
 const clean=()=>{for(const key of Object.keys(localStorage))if(key.startsWith(prefix))localStorage.removeItem(key);};
 async function open(source,width){
  const f=document.createElement('iframe');f.width=width;f.height=850;f.title='検証用牧場';
  const end='})();\n<\/script>';check(source.split(end).length===2,'initialization script marker');
  const loaded=new Promise((ok,no)=>{f.onload=ok;f.onerror=no;});
  f.srcdoc=source.replaceAll('monster_biyori_',prefix).replace('<script>','<script>window.requestAnimationFrame=()=>0;').replace(end,()=>hooks+'\n'+end);
  mount.append(f);await loaded;
  for(let i=0;i<160&&!f.contentWindow.qaEq?.ready();i++)await new Promise(r=>setTimeout(r,25));
  check(f.contentWindow.qaEq?.ready(),'map and character sheets decoded');return f;
 }
 try{
  result.textContent='';run.disabled=true;
  const [oldHtml,newHtml]=await Promise.all([read('../releases/1.25.11/game.html'),read('../game.html')]);
  for(const width of [1366,390]){
   clean();
   let f=await open(oldHtml,width); check(f.contentWindow.qaEq.seed(),'write legacy fixture'); f.remove();
   f=await open(oldHtml,width); const old=f.contentWindow.qaEq;
   const raw=localStorage.getItem(prefix+'save_v1'),save=old.snapshot(),pics=Array.from(old.rasters(),c=>c.toDataURL()),combat=old.battle(); f.remove();localStorage.setItem(prefix+'save_v1',raw);
   f=await open(newHtml,width);const w=f.contentWindow;
   check(w.document.title.includes('1.25.12'),'candidate version');
   check(w.qaEq.snapshot()===save,'legacy progress, loot, equipment, and map');
   check(Array.from(w.qaEq.rasters(),c=>c.toDataURL()).every((p,i)=>p===pics[i]),'world and monster pixels unchanged');
   check(w.qaEq.battle()===combat,'legacy combat with auto off exact');
   f.remove();localStorage.setItem(prefix+'save_v1',raw);f=await open(newHtml,width);f.contentWindow.qaEqProbe();f.remove();
   result.textContent+=width+'px: 旧セーブ、見た目、装備と戦闘、工房の在庫上限\n';
  }
  result.textContent+='すべて成功';
 }catch(e){result.textContent+='失敗 '+e.stack;}finally{mount.replaceChildren();clean();run.disabled=false;}
};
</script></html>
