<!doctype html><html lang="ja"><meta charset="utf-8"><title>もんすたー日和 1.25.0 動作確認</title>
<h1>森の庭だより 動作確認</h1><button id="run">検証を開始</button><pre id="result" aria-live="polite"></pre><div id="screens"></div>
<script>
'use strict';
function fixture(){
 const site=type=>state.buildings.find(b=>b.type===type);
 function add(type,x,y,level=1){const b={id:state.nextId++,type,x,y,level,facing:0};state.buildings.push(b);return b;}
 function level(n){state.villageLv=state.worldTreeLevel=site('worldtree').level=n;}
 function seed(){
  state.speed=0;state.ranchName='洞窟の牧場';state.food=317.25;state.coins=41000;state.magic=130;state.day=17;state.hour=14;
  level(5);state.villageXp=500;state.reserveRareMaterials=false;state.expeditionAuto213=false;
  add('lamp211',5,6).facing=1;add('shirovane130',6,8);add('onsen130',12,7).facing=2;state.paths.push('6,8');state.stoneTiles={'6,8':true};
  add('guild212',13,6,3).constructionPaid=1150;add('expeditionOffice',7,2,4);
  state.treasures=[0,10];state.treasureStock={0:2,10:1};state.materialStock211[0]=85;state.materialStock211[5]=17;ensureMaterials211();
  state.economy.ordersDone=4;state.economy.eventDay=16;state.economy.treasureOrdersDone=2;state.exploreProgress=37;
  state.paths.push('4,6');state.removedDefaultPaths.push('10,12');
  state.charms=2;equipCharm(state.monsters[0].id);
  save(true);
 }
 function snapshot(){return JSON.stringify([state.ranchName,state.speed,state.day,state.hour,state.coins,state.food,state.magic,
  state.villageLv,state.villageXp,state.buildings.map(b=>[b.id,b.type,b.x,b.y,b.facing,b.level,investedIn(b)]),
  state.paths,state.stoneTiles,state.removedDefaultPaths,state.treasures,state.reserveRareMaterials,state.materialStock211,state.stock,state.treasureStock,
  state.monsters.map(m=>[m.id,m.name,m.kind,m.lv,m.xp,m.equip,m.iv,m.shiny]),state.staff.map(w=>[w.id,w.name,w.job,w.level,w.work]),
  state.charms,state.expeditionAuto213,state.exploreProgress,state.economy.ordersDone,state.economy.treasureOrdersDone,state.economy.eventDay,state.research,state.party]);}


 function ready(){return !!(state&&facilitySheetReady&&villageSheetReady&&lionReady);}
 window.qa250={seed,snapshot,ready};
 if(GAME_APP_VERSION!=='1.25.0')return;
 (function(){
const check=(v,msg)=>{if(!v)throw Error(msg);};
const types=['mushroom250','birdbath250','lantern250','roseArch250','acorn250'];
const original=JSON.stringify(state);
const fresh=(day=1)=>{
 state=JSON.parse(original);
 Object.assign(state,{day,hour:12,speed:1,coins:250000,villageLv:8,worldTreeLevel:8,
  zones:[0,1,4,5],buildings:[{type:'worldtree',id:4300,x:15,y:1,level:8,facing:0}],nextId:7400,
  monsters:[],staff:[],guests:[],party:[],paths:[],ponds:[],stoneTiles:{},removedDefaultPaths:[...DEFAULT_PATH_KEYS],clearedPonds:[],clearedScenery:[]});
 for(let x=0;x<22;x++)for(let y=0;y<18;y++){state.clearedPonds.push(keyXY(x,y));state.clearedScenery.push(keyXY(x,y));}
 tickAccum=0;placementFacing=0;clearMode=false;terrainMode=null;moveMode=null;buildMode=null;selectedBuilding=null;selectedMonster=null;hover=null;
 stopWalkCamera();state.economy.festival=false;
};
const level=n=>{state.villageLv=state.worldTreeLevel=n;state.buildings.find(b=>b.type==='worldtree').level=n;};
const road=(x,y)=>{const k=keyXY(x,y);if(!state.paths.includes(k))state.paths.push(k);};
const row=(y,x1,x2)=>{for(let x=x1;x<=x2;x++)road(x,y);};
const friend=(x,y,kind=shirogaoKind,id=6413)=>{
 const m=makeMonster(id,kind,x,y);state.monsters.push(m);m.path=[];m.phase213=phase213(state.hour);monsterWalkTimer139(m).wait=50;return m;
};
const prop=(t,x=8,y=8)=>{
 place(t,x,y);const b=getBuildingAt(x,y);check(b?.type===t,'設置 '+t);selectedBuilding=null;buildMode=null;return b;
};
const forBird=(b,wanted)=>{
 for(let h=7;h<18;h++)for(let i=0;i<160;i++){
  state.hour=h;tickAccum=i/160;
  const bird=gardenBird250(b);if(bird&&Math.abs(bird.t-wanted)<.055)return bird;
 }
 throw Error('小鳥の時刻 '+wanted);
};
const step=(duration)=>{
 for(let i=0;i<Math.round(duration/.05);i++){
  tickAccum+=.05/16;
  if(tickAccum>=1){state.hour++;tickAccum--;}
  stepActors(.05);
 }
};
const stateOfGoods=()=>JSON.stringify([state.coins,state.stock,state.food,state.treasureStock,state.materialStock211,state.economy.ordersDone,state.shopStats211]);
function placement(){
 const log=[];
 for(const [i,t] of types.entries()){
  fresh();level(Math.max(1,i));tab='build';facilityRole='tourism';renderUI(true);
  const card=()=>$('tabBody').querySelector('[data-action="build"][data-id="'+t+'"]');
  check(card()&&card().closest('.build-option').textContent.includes(B[t].name),'施設一覧 '+t);
  if(i>0){const balance=state.coins;check(card().disabled,'未解放の建設ボタン '+t);place(t,8,8);check(!getBuildingAt(8,8)&&balance===state.coins,'解放前の建設 '+t);}
  level(i+1);renderUI(true);check(!card().disabled,'解放Lv '+t);
  card().click();check(buildMode===t,'建設ボタン '+t);
  const cost=constructionCost(t),balance=state.coins;
  putTerrain('stone',8,8);const b=prop(t);
  check(state.coins===balance-cost-100&&state.stoneTiles['8,8'],'石畳への建設費 '+t);
  for(const f of [1,2,3,0]){setFacilityFacing({building:b,direction:b.facing,preview:false},f);check(b.facing===f,'回転 '+t);}
  const id=b.id;
  startMoving(id);placementFacing=3;moveBuilding(6,6);check(b.x===6&&b.y===6&&b.facing===3&&state.stoneTiles['8,8'],'移設と元の路面 '+t);
  const paid=state.coins;place(t,6,6);check(state.coins===paid&&getBuildingAt(6,6)===b,'重複防止 '+t);
  putTerrain('road',6,6);check(isPath(6,6),'道を敷く '+t);
  check(save(true)&&load(),'保存・再読込 '+t);
  const after=state.buildings.find(v=>v.id===id);check(after?.type===t&&after.facing===3&&after.x===6&&isPath(6,6),'新装飾の保存 '+t);
  recoverBuilding(id);check(!getBuildingAt(6,6)&&isPath(6,6),'回収後の床 '+t);
  log.push(B[t].name+' Lv.'+(i+1));
 }
 return log.join('、');
}
function passage(){
 fresh();row(8,5,11);road(8,7);prop('farm',8,6-1); // sole frontage at y=7
 const walker=friend(8,7);walker.path=[[8,8],[9,8]];
 const paths=[...state.paths];
 const arch=prop('roseArch250',8,7);
 check(entranceRoads(state.buildings.find(b=>b.type==='farm')).length===1,'ほかの建物の入口にアーチ');
 check(state.paths.join()===paths.join()&&residentRoad(8,7)&&walker.x===8&&walker.y===7&&walker.path.length===2,'歩行中の設置');
 for(const f of [0,1,2,3]){
  setFacilityFacing({building:arch,direction:arch.facing,preview:false},f);
  const through=pathTo(7,8,8,7,true);check(through.at(-1)?.join()==='8,7','全方向からの通行 '+f);
 }
 startMoving(arch.id);moveBuilding(8,8);
 const route=pathTo(5,8,11,8,true);check(route.some(p=>p.join()==='8,8')&&route.length===6,'道の両端をアーチ経由で結ぶ');
 walker.x=5;walker.y=8;walker.path=route;
 for(let i=0;i<240&&walker.path.length;i++)walkPlotLeg(walker,walker.path,.05);
 check(walker.x===11&&walker.y===8,'アーチ通過完了');
 check(!canBuild(8,8,null,true,'lantern250'),'アーチと他の建物は重ならない');
}
function visits(){
 fresh();row(9,5,11);const b=prop('birdbath250'),m=friend(8,9),other=friend(9,9,1,6414);
 forBird(b,2);step(.50);check(ranchSceneVisual124(m)?.kind==='watchBird','小鳥を見守る');
 step(1.4);check(ranchSceneVisual124(other)?.kind==='watchBird'&&gardenBird250(b).phase==='bath','近くの2匹と水浴び');
 const pos=[m.x,m.y,other.x,other.y];step(2.0);check(JSON.stringify(pos)===JSON.stringify([m.x,m.y,other.x,other.y]),'見守り中は静止');
 for(const [t,phase] of [[.5,'arrive'],[1.9,'hop'],[5,'bath'],[9.5,'shake'],[11,'leave']])check(forBird(b,t).phase===phase,'小鳥 '+phase);
 forBird(b,11.7);step(.7);check(!ranchSceneVisual124(m)&&!gardenBird250(b),'小鳥と見守りの終了');
 state.hour=23;check(!gardenBird250(b),'夜の水鉢');
 fresh();row(9,5,11);road(8,7);const seat=prop('mushroom250'),large=friend(8,7,SPECIES.findIndex(s=>s.large),7401),small=friend(8,9);
 step(3);const sit=ranchSceneVisual124(small);check(sit?.kind==='mushroomSit'&&sit.phase==='use'&&!ranchSceneVisual124(large),'小柄な仲間が座る');
 check(gardenSeatWeight250(sit)>.95&&plotImageRect(seat).w<plotImageRect({type:'bench211',x:8,y:8}).w,'ベンチより小さな座面');
 state.speed=0;const elapsed=sit.elapsed;stepActors(.5);check(sit.elapsed===elapsed,'一時停止');state.speed=1;
 const route=small.path;check(save(true),'着席中の保存');const serialized=JSON.parse(localStorage.getItem(SAVE_KEY));
 check(serialized.monsters.find(o=>o.id===small.id).path.length===0,'一時経路の保存除外');
 step(7);check(!ranchSceneVisual124(small),'降りて行動を再開');
 check(load(),'着席中のセーブを開く');const restored=state.monsters.find(v=>v.id===small.id);
 check(restored&&!ranchSceneVisual124(restored)&&!Object.values(gardenActs250).includes(restored.act)&&residentRoad(...ranchTile124(restored)),'着席中の保存から道へ復帰');
 fresh(3);row(9,5,11);const crate=prop('acorn250'),fan=friend(8,9);
 step(1.5);check(!ranchSceneVisual124(fan),'春の屋台');state.day=15;monsterWalkTimer139(fan).wait=35;
 const goods=stateOfGoods();step(3);const browse=ranchSceneVisual124(fan);
 check(browse?.kind==='browseNuts'&&browse.phase==='use'&&gardenNutLift250(browse.elapsed)===1,'秋に実を手に取る');
 step(3.8);check(!ranchSceneVisual124(fan)&&stateOfGoods()===goods,'実を戻す・在庫と売上');
 fresh(15);row(9,5,11);const moved=prop('acorn250'),visitor=friend(8,9);step(2);
 check(ranchSceneVisual124(visitor),'移動中断の準備');startMoving(moved.id);moveBuilding(11,5);step(.1);
 check(!ranchSceneVisual124(visitor),'屋台の移設で安全に終了');
}
function baths(){
 for(const direction of [0,1,2,3]){
  fresh();state.hour=18;placementFacing=direction;
  row(7,7,11);row(11,7,11);
  for(let y=7;y<=11;y++){road(7,y);road(11,y);}
  const b=prop('onsen130');const door=entranceRoads(b)[1];check(door,'露天風呂の入口');
  const guest=friend(...door);check(startFacilityVisit(guest,b,{pt:door,path:[]}),'入浴開始');
  let bathed=false;
  for(let i=0;i<700&&monsterWalkTimer139(guest).visit;i++){
   advanceFacilityVisit(guest,.05);
   if(!bathed&&onsenVisual130(guest)){bathed=true;drawWorld(900);}
  }
  check(bathed&&!monsterWalkTimer139(guest).visit&&residentRoad(...ranchTile124(guest)),'露天風呂の描画・入浴・退出 '+direction);
 }
}
function rendering(){
 fresh();const arch=prop('roseArch250'),r=plotImageRect(arch);
 function sample(draw,area=r){
  ctx.save();ctx.setTransform(1,0,0,1,100-area.x,100-area.y);ctx.clearRect(area.x-10,area.y-10,160,160);draw();ctx.restore();
  return ctx.getImageData(90,90,160,160).data;
 }
 const count=a=>{let n=0;for(let i=3;i<a.length;i+=4)if(a[i])n++;return n;};
 for(const [day,visible] of [[1,true],[8,false],[15,true],[22,false]]){
  state.day=day;check((count(sample(()=>drawRoseFall250(arch,r,2600)))>0)===visible,'四季の花びらと赤い葉 '+day);
 }
 const lamp=prop('lantern250',8,10);
 state.hour=12;const day=spriteBuildingV161(lamp.type,1,0);
 check(count(sample(()=>drawGardenLanternGround250(lamp),plotImageRect(lamp)))===0,'昼の花柄ガラス');
 state.hour=22;const night=spriteBuildingV161(lamp.type,1,0);
 check(day!==night&&count(sample(()=>drawGardenLanternGround250(lamp),plotImageRect(lamp)))>0,'夜の光と花の影');
 check(plotImageRect(lamp).h<plotImageRect({type:'lamp211',x:8,y:10}).h,'街灯より小さな明かり');
 fresh(15);row(9,5,11);prop('acorn250');friend(8,9);step(3);drawWorld(3000);drawBattle(3000);
 return '四季、昼夜、描画、一時停止';
}

 Object.assign(window.qa250,{placement,passage,visits,rendering,baths});
 })();
}
const out=document.querySelector('#result'),mount=document.querySelector('#screens');
const check=(ok,label)=>{if(!ok)throw Error(label);};
const log=line=>out.textContent+=line+'\n';
document.querySelector('#run').onclick=async({currentTarget:button})=>{
 button.disabled=true;out.textContent='';
 const prefix='v1250_qa_'+crypto.randomUUID()+'_';
 const clear=()=>{for(const k of Object.keys(localStorage))if(k.startsWith(prefix))localStorage.removeItem(k);};
 try{
  async function read(path){const r=await fetch(path,{cache:'no-store'});check(r.ok,path+' HTTP '+r.status);return r.text();}
  const [prior,latest]=await Promise.all([read('../releases/1.24.31/game.html'),read('../game.html')]);
  async function open(source,width){
    const f=document.createElement('iframe');f.title='検証用牧場';f.width=width;f.height=width===390?844:900;
    const end='})();\n<\/script>';
    check(source.split(end).length===2,'ゲームの初期化スクリプト');
    f.srcdoc=source.replaceAll('monster_biyori_',prefix).replace('<script>','<script>window.requestAnimationFrame=()=>0;window.confirm=()=>true;')
      .replace(end,()=>fixture.toString()+'\nfixture();\n'+end);
    const ready=new Promise((resolve,reject)=>{f.onload=resolve;f.onerror=reject;});mount.append(f);await ready;
    const w=f.contentWindow;
    for(let i=0;i<250&&!w.qa250?.ready();i++)await new Promise(r=>setTimeout(r,20));
    check(w.qa250?.ready(),'画像の読み込み');return {w,f};
  }
  for(const width of [1366,390]){
    clear();const seed=await open(prior,width);seed.w.qa250.seed();seed.f.remove();
    const old=await open(prior,width);const snapshot=old.w.qa250.snapshot();old.f.remove();
    const current=await open(latest,width);
    check(current.w.document.title.includes('1.25.0'),'ゲームの版番号');
    check(current.w.qa250.snapshot()===snapshot,'1.24.31セーブの引き継ぎ');
    check(width!==390||current.w.document.documentElement.scrollWidth<=391,'スマートフォン幅');
    log(width+'px 旧セーブの引き継ぎ');
    log(width+'px 建設・解放・保存 '+current.w.qa250.placement());
    current.w.qa250.passage();log(width+'px アーチ通行・最後の入口保護');
    current.w.qa250.visits();log(width+'px 小鳥、着席、秋の屋台と経済');
    log(width+'px '+current.w.qa250.rendering());
    current.w.qa250.baths();log(width+'px 露天風呂の4方向と入浴');
    current.f.remove();
  }
  log('すべて成功');
 }catch(e){log('失敗 '+e.stack);}finally{mount.replaceChildren();clear();button.disabled=false;}
};

</script></html>
