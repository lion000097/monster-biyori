<!doctype html>
<html lang="ja"><meta charset="utf-8">
<title>もんすたー日和 1.24.9 動作検証</title>
<h1>もんすたー日和 1.24.9 動作検証</h1>
<button id="run">検証を開始</button><pre id="result" aria-live="polite"></pre>
<script>
'use strict';
function ranchFixture(){
  const check=(condition,label)=>{if(!condition)throw Error(label)};
  function seed(){
    Object.assign(state,{speed:0,ranchName:'なよ牧場',coins:34567,food:191.5,magic:33,fame:127});
    state.monsters[1].shiny=true;addCatalogMonster(state.monsters[1]);state.party=[state.monsters[1].id];
    state.treasures=[0,1];state.adventure.stage=7;state.adventure.clears=6;
    state.postcards[0]={count:3,day:1,sender:'旅人アン'};
    save(true);
  }
  function snapshot(){
    return JSON.stringify([state.ranchName,state.coins,state.food,state.magic,state.fame,state.day,state.hour,
      state.monsters.map(m=>[m.id,m.kind,m.lv,m.xp,m.shiny]),state.restingMonsters,state.party,
      state.staff.map(w=>[w.id,w.name,w.job,w.level]),state.buildings.map(b=>[b.id,b.type,b.level,b.x,b.y,b.facing]),
      state.adventure,state.catalog,state.treasures,state.materialStock211,state.postcards,state.zones]);
  }
  function roadLayout(){
    state.buildings=[];state.guests=[];state.ponds=[];state.paths=[];state.removedDefaultPaths=[...DEFAULT_PATH_KEYS];
    state.zones=[0,1,4,5];state.clearedScenery=[];state.clearedPonds=[];
    for(let x=0;x<22;x++)for(let y=0;y<20;y++){
      state.clearedScenery.push(keyXY(x,y));state.clearedPonds.push(keyXY(x,y));
    }
    for(let x=0;x<22;x++)state.paths.push(keyXY(x,8));
  }
  function placeAlongRoad(type,x){
    const b={type,id:state.nextId++,x,y:8-buildingMeta(type).h,facing:0,level:1};
    state.buildings.push(b);return b;
  }
  function guests(){
    roadLayout();const shop=placeAlongRoad('shop',5),office=placeAlongRoad('postOffice',12);
    state.postcards=[];state.fame=10000;ensureMaterials211();state.materialStock211[0]=30;state.stock=30;
    const customers=state.shopStats211.customers,visitors=state.economy.totalVisitors;
    const previous=Math.random;Math.random=()=>.32;
    try{
      visitTick(false);let g=state.guests[0];check(g?.shopId200===shop.id,'shop visitor spawned');
      let served=false,detour=false,posted=false,loaded=false;
      for(let i=0;i<1800&&!g.gone212;i++){
        animateGuest212(g,.09);
        if(g.checkedOut211)served=true;
        if(g.phase212==='detour'&&g.visitBuildingId===office.id){
          detour=true;
          if(!loaded&&plotWalks.get(g)?.phase==='use'){
            save(true);check(load(),'reload during stop');g=state.guests[0];loaded=true;
          }
        }
        posted ||= !!g.postedCard;
      }
      check(served&&detour&&loaded&&posted&&g.gone212,'shop, detour, reload, post, exit');
      check(state.shopStats211.customers===customers+1&&state.economy.totalVisitors===visitors+1,'one shopper and arrival');
      check(state.postcards.reduce((n,p)=>n+(p?.count||0),0)===1,'only one postcard');
      const closed=state.buildings.find(b=>b.id===office.id);
      const another={x:6,y:8,entered211:true,arrived211:true,visitBuildingId:shop.id};
      state.paths=state.paths.filter(key=>!['8,8','9,8','10,8'].includes(key));
      finishGuestVisit(another);check(another.phase212==='leave','disconnected stop');
      state.paths.push('8,8','9,8','10,8');finishGuestVisit(another);check(another.phase212==='detour','reconnected stop');
      state.paths=state.paths.filter(key=>key!=='9,8');
      for(let i=0;i<250&&another.phase212==='detour';i++)animateGuest212(another,.08);
      check(another.phase212==='leave'&&another.x<9,'road removed during detour');
      state.paths.push('9,8');
      const last={x:6,y:8,entered211:true,arrived211:true,visitBuildingId:shop.id};
      finishGuestVisit(last);check(last.phase212==='detour','next stop selected');
      state.buildings=state.buildings.filter(b=>b!==closed);
      animateGuest212(last,.08);check(last.phase212==='leave','removed stop');
    }finally{Math.random=previous}
  }
  function pastimes(){
    roadLayout();state.staff=[];state.speed=1;state.hour=12;
    const m=makeMonster(100,0,5,8),friend=makeMonster(101,1,7,8);
    state.monsters=[m,friend];
    const timer=monsterWalkTimer139(m),other=monsterWalkTimer139(friend);
    other.wait=90;timer.wait=0;
    const previous=Math.random;Math.random=()=>.05;
    try{
      stepActors(.08);
      check(timer.pastime?.kind==='nap'&&m.act.includes('お昼寝'),'nap starts without input');
      drawMapActor(m,true,500);
      const rect=mapPickItems.at(-1).rect;
      check(rect.h<rect.w,'resting pose and selection bounds');
      const start=[m.x,m.y,m.xp,m.energy,m.bond];
      for(let n=0;n<65;n++)stepActors(.08);
      check(!timer.pastime&&JSON.stringify([m.x,m.y,m.xp,m.energy,m.bond])===JSON.stringify(start),'nap ends without stat changes');
      Math.random=()=>.22;timer.wait=0;other.wait=90;
      stepActors(.08);
      check(timer.pastime?.partner===friend&&other.pastime?.partner===m,'paired chase starts');
      let farthest=m.x;
      for(let n=0;n<120&&timer.pastime;n++){
        stepActors(.08);farthest=Math.max(farthest,m.x);
        check(residentRoad(Math.round(m.x),Math.round(m.y))&&residentRoad(Math.round(friend.x),Math.round(friend.y)),'chase stays on road');
      }
      check(farthest>7&&friend.x>m.x&&!timer.pastime&&!other.pastime,'both run and stop');
      m.x=5;friend.x=7;timer.wait=0;other.wait=90;
      stepActors(.08);check(!!timer.pastime,'second chase');
      state.monsters=[m];stepActors(.08);
      check(!timer.pastime&&!other.pastime,'partner leaves mid-chase');
      state.hour=22;timer.wait=0;stepActors(.08);check(!timer.pastime,'night routine');
    }finally{Math.random=previous}
  }
  function battle(){
    state.monsters=Array.from({length:6},(_,i)=>Object.assign(makeMonster(state.nextId++,0,7,8),{lv:6-i}));
    const accept=window.confirm;window.confirm=()=>true;
    function part(member){
      openMonsterDetails(member.id,canvas);
      document.querySelector('[data-v171-action="partMonster"]').click();
      check(!state.monsters.includes(member),'parting button');
    }
    try{
      for(const automatic of [false,true]){
        state.party=automatic?[]:[state.monsters[0].id];startAdventure();
        const active=state.battle,previous=JSON.stringify(active);check(active,'battle started');
        part(state.monsters.find(m=>!crewParty().includes(m)));
        check(state.battle===active&&JSON.stringify(active)===previous,'nonparticipant leaves during battle');
        part(crewParty()[0]);check(state.battle===null,'participant leaves during battle');
      }
    }finally{window.confirm=accept}
  }
  function weather(){
    roadLayout();state.economy.festival=false;
    function sample(draw){
      ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,720,480);
      draw();ctx.restore();
      const data=ctx.getImageData(0,0,720,480).data;
      let count=0,hash=0;for(let i=3;i<data.length;i+=4)if(data[i]){count++;hash=(hash*31+i+data[i])>>>0;}
      return {count,hash};
    }
    const days=Array.from({length:84},(_,i)=>i+1);
    const afterRain=days.find(day=>day>1&&weatherInfo(day-1).name==='雨'&&weatherInfo(day).name==='晴れ');
    const summer=days.find(day=>seasonInfo(day).name==='夏'&&weatherInfo(day).name==='晴れ');
    const wet=days.find(day=>seasonInfo(day).name==='夏'&&weatherInfo(day).name==='雨');
    const spring=days.find(day=>seasonInfo(day).name==='春'&&weatherInfo(day).name==='晴れ');
    const fireflies=now=>sample(()=>{ctx.translate(360,10);drawSummerFireflies(now,{minX:0,minY:0,maxX:16,maxY:16});});
    state.day=afterRain;state.hour=8;
    check(sample(drawMorningRainbow).count>1000,'rainbow painted on clear morning after rain');
    state.hour=15;check(!sample(drawMorningRainbow).count,'rainbow fades before noon');
    state.day=afterRain-1;state.hour=8;check(!sample(drawMorningRainbow).count,'no rainbow while raining');
    state.day=1;check(!sample(drawMorningRainbow).count,'no previous rain on first day');
    state.day=summer;state.hour=20;
    const first=fireflies(1000),again=fireflies(1000),later=fireflies(1600);
    check(first.count>0&&later.count>0&&first.hash===again.hash&&first.hash!==later.hash,'fireflies drift and pulse with the map clock');
    state.hour=2;check(fireflies(1000).count>0,'fireflies after midnight');
    state.hour=12;check(!fireflies(1000).count,'no fireflies in daylight');
    state.hour=20;state.day=wet;check(!fireflies(1000).count,'no fireflies in rain');
    state.day=spring;check(!fireflies(1000).count,'summer only');
  }
  window.ranchQA={ready:()=>villageSheetReady&&facilitySheetReady,seed,snapshot,guests,pastimes,battle,weather};
}
async function verify(width,previous,current){
  const prefix='qa1249_'+crypto.randomUUID()+'_',errors=[];let frame;
  async function open(html){
    frame?.remove();frame=document.createElement('iframe');frame.width=width;frame.height=width===390?844:900;
    const end='})();\n<\/script>';
    if(!html.includes(end))throw Error('missing game entry');
    frame.srcdoc=html.replaceAll('monster_biyori_',prefix).replace(end,()=> '('+ranchFixture.toString()+')();\n'+end);
    const ready=new Promise(resolve=>frame.onload=resolve);document.body.append(frame);await ready;
    frame.contentWindow.addEventListener('error',e=>errors.push(e.message));
    const qa=frame.contentWindow.ranchQA;
    for(let n=0;qa&&!qa.ready()&&n<200;n++)await new Promise(resolve=>setTimeout(resolve,30));
    if(!qa?.ready())throw Error('game or sprites failed to load');return qa;
  }
  try{
    let qa=await open(previous);qa.seed();qa=await open(previous);const legacy=qa.snapshot();
    qa=await open(current);
    const currentSave=qa.snapshot(),before=JSON.parse(legacy),after=JSON.parse(currentSave);
    if(currentSave!==legacy){
      const i=before.findIndex((v,i)=>JSON.stringify(v)!==JSON.stringify(after[i]));
      throw Error('old save field '+i+' / '+JSON.stringify(before[i])+' / '+JSON.stringify(after[i]));
    }
    if(frame.contentDocument.documentElement.scrollWidth>frame.contentWindow.innerWidth+1)throw Error('layout width');
    qa.battle();qa.guests();qa.pastimes();qa.weather();
    if(errors.length)throw Error(errors.join(' / '));
    document.querySelector('#result').textContent+=width+'px 成功\n';
  }finally{
    frame?.remove();for(const k of Object.keys(localStorage))if(k.startsWith(prefix))localStorage.removeItem(k);
  }
}
document.querySelector('#run').onclick=async({currentTarget})=>{
  currentTarget.disabled=true;const output=document.querySelector('#result');output.textContent='';
  try{
    const pages=await Promise.all(['../releases/1.24.8/game.html','../releases/1.24.9/game.html'].map(async url=>{
      const response=await fetch(url);if(!response.ok)throw Error(url);return response.text();
    }));
    for(const width of [1366,390])await verify(width,...pages);
    output.textContent+='すべて成功';
  }catch(e){output.textContent+='失敗 '+e.stack;}
  finally{currentTarget.disabled=false;}
};
</script></html>
