 function newAmbient(){

   for(let i=0;i<4;i++){

 function sleepScenario(){
  const check=(value,label)=>{if(!value)throw Error(label);};
  const walk=seconds=>{for(let n=0;n<seconds*20;n++)stepActors(.05);};
  const home=()=>state.buildings.find(b=>b.type==='home');
  const inside=m=>m.indoorRest?.buildingId===home().id&&plotWalks.get(m)?.phase==='use';
  const id=home().id;
  check(entranceRoads(home()).length,'新規牧場のハウスに正面の道がある');
  state.speed=1;state.hour=20;
  for(const next of [21,22,23,0,1,2,3,4,5,6]){
   tick(false);check(state.hour===next,'実際の時計で'+next+'時');
   walk(16);
   if(next===21||next===22)continue;
   if(next===6){
    check(state.monsters.every(m=>!m.indoorRest),'朝に起きて再表示');
    continue;
   }
   check(state.monsters.every(inside),next+'時も全員がハウス内で就寝');
   if(next===23){
    const sleepState=JSON.stringify(state.monsters.map(m=>[m.id,m.indoorRest.remaining,m.facilityDoor]));
    const stable=[state.food,state.magic,state.coins,state.villageLv];
    check(save(true)&&load(),'就寝中のセーブを読み直せる');
    check(home().id===id&&state.monsters.every(inside)&&JSON.stringify(state.monsters.map(m=>[m.id,m.indoorRest.remaining,m.facilityDoor]))===sleepState,'夜中のセーブ後も同じハウスで就寝');
    check(JSON.stringify(stable)===JSON.stringify([state.food,state.magic,state.coins,state.villageLv]),'資源と世界樹は引き継がれる');
    const actors=[],bubbles=[],paintActor=drawMapActor,bubble=drawMapBubble;
    drawMapActor=(actor,...args)=>{actors.push(actor.id);return paintActor(actor,...args);};
    drawMapBubble=(x,y,icon,now,b)=>{if(icon==='Zz')bubbles.push(b);return bubble(x,y,icon,now,b);};
    try{drawWorld(100);}
    finally{drawMapActor=paintActor;drawMapBubble=bubble;}
    check(bubbles.length===1&&bubbles[0]===id&&state.monsters.every(m=>!actors.includes(m.id)),'屋根に吹き出し一つ、就寝中の姿は非表示');
   }
  }
  for(let facing=0;facing<4;facing++){
   const relocated={type:'home',id:901,x:5+facing,y:6,level:1,facing},disconnected={type:'home',id:902,x:16,y:3,level:1,facing:0};
   state.buildings=[disconnected,relocated];state.staff=[];state.guests=[];state.day++;state.hour=22;
   state.paths=[];state.ponds=[];state.clearedScenery=[];state.clearedPonds=[];state.removedDefaultPaths=[...DEFAULT_PATH_KEYS];
   for(let x=2;x<13;x++)for(let y=2;y<13;y++){
    const key=keyXY(x,y);state.clearedPonds.push(key);state.clearedScenery.push(key);
    if(!getBuildingAt(x,y))state.paths.push(key);
   }
   const m=makeMonster(910,0,3,7),timer=monsterWalkTimer139(m);
   state.monsters=[m];state.party=[m.id];timer.nextRest=0;timer.wait=0;
   check(entranceRoads(relocated).length&&!entranceRoads(disconnected).length,'正面の道とつながらないハウスを作る');
   walk(12);
   check(m.indoorRest?.buildingId===relocated.id&&plotWalks.get(m)?.phase==='use','到達できるハウスを探して実際に入る：向き'+facing);
   check(entranceRoads(relocated).some(([x,y])=>x===m.facilityDoor[0]&&y===m.facilityDoor[1]),'正面から入る：向き'+facing);
   const [x,y]=m.facilityDoor;state.hour=6;
   for(let n=0;n<200&&plotWalks.has(m);n++)stepActors(.05);
   check(!m.indoorRest&&!plotWalks.has(m)&&m.x===x&&m.y===y,'起床すると同じ正面から戻る：向き'+facing);
  }
  return true;
 }
 function treeCourtyard(){
  const check=(ok,label)=>{if(!ok)throw Error(label);};
  const tree=state.buildings.find(b=>b.type==='worldtree');
  Object.assign(tree,{x:4,y:4});
  state.zones=[0,1,4,5];state.buildings=[tree];state.paths=[];state.ponds=[];
  state.removedDefaultPaths=[...DEFAULT_PATH_KEYS];
  const m=state.monsters[0],points=[];
  state.monsters=[m];
  const stats=[state.coins,state.food,state.magic,state.stock];
  for(let dir=0;dir<4;dir++){
   tree.facing=dir;
   for(const ratio of [1/12,11/12]){
    const door=frontPoint('worldtree',tree.x,tree.y,dir,ratio,.5).map(Math.floor);
    state.paths=[keyXY(...door)];state.clearedScenery=state.paths.slice();state.clearedPonds=state.paths.slice();
    Object.assign(m,{x:door[0],y:door[1],path:[],ranchTarget200:null});
    startFacilityVisit(m,tree,{pt:door,path:[]});
    let p=0;for(;plotWalks.get(m)?.phase!=='use'&&p<240;p++)advanceFacilityVisit(m,.1);
    check(plotWalks.get(m)?.phase==='use','arrived from facing '+dir);
    const x=m.x+.5-tree.x,y=m.y+.5-tree.y;
    check([x,y,6-x,6-y].every(v=>v>=1.25),'fully inside and not only on outer edge '+JSON.stringify({x,y,dir}));
    check(Math.abs(x-y)>1.9,'not directly behind trunk');
    check(worldTreeCourtyardContains(tree,m.x+.5,m.y+.5),'courtyard view uses foreground order');
    check(!m.indoorRest,'World Tree is not a bedroom');
    points.push([+x.toFixed(2),+y.toFixed(2)]);
    for(let i=0;plotWalks.get(m)&&i<240;i++)advanceFacilityVisit(m,.1);
    check(!plotWalks.get(m)&&m.x===door[0]&&m.y===door[1],'returns through original door');
   }
  }
  check(JSON.stringify(stats)===JSON.stringify([state.coins,state.food,state.magic,state.stock]),'no resource change');
  return points;
 }

function compareYards(previous,current){
 if(previous.length!==80||current.length!==80)throw Error('柵内の装飾80通り');
 for(let n=0;n<previous.length;n++){
  const a=previous[n],b=current[n];
  if(a.key!==b.key||a.width!==b.width||a.height!==b.height)throw Error('施設のサイズ変更：'+a.key);
  let changes=0;
  for(let i=0;i<a.pixels.length;i+=4){
   if(a.pixels[i+3]!==b.pixels[i+3])throw Error('施設の輪郭変更：'+a.key);
   if(a.pixels[i]!==b.pixels[i]||a.pixels[i+1]!==b.pixels[i+1]||a.pixels[i+2]!==b.pixels[i+2])changes++;
  }
  if(changes<=0||changes>=a.width*a.height*.035)throw Error('装飾だけの変更ではない：'+a.key+' '+changes);
 }
}

  const loaded=new Promise(r=>frame.onload=r);document.body.append(frame);await loaded;

 }

  compareYards(yards,q.yardFrames());
  const fresh=q.cave();if(new Set(fresh).size!==4||fresh.some((v,i)=>v!==art[i]))throw Error('洞窟の四方向');
  if(Math.abs(q.sale()-sale)>1.1)throw Error('店頭売上の調整');q.materials();q.menu();q.growth();q.citizens();q.ambient();q.newAmbient();q.treeCourtyard();q.starterTreeRoad();q.overnightHome();
  document.querySelector('#result').textContent+=width+'px 成功\n';
 }finally{frame?.remove();for(const k of Object.keys(localStorage))if(k.startsWith(prefix))localStorage.removeItem(k);}
}
