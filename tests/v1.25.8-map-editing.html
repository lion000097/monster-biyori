q1257.run=function*(only){

 if(!only||only==='undo'){

  finally{canvas.getBoundingClientRect=rect;canvas.hasPointerCapture=has;}
  check(pointList.every(p=>state.stoneTiles[p.join(',')]===true)&&state.coins<beforeStroke,'real multi-tile paid brush stroke');
  btn.click();check(pointList.every(p=>!isPath(...p)&&!state.stoneTiles[p.join(',')])&&state.coins===beforeStroke,'single undo atomically refunds and removes brush stroke');

  btn.click();check(!getBuildingAt(x,y)&&state.coins===coins&&state.villageXp===xp&&state.fame===fame&&state.economy.expense===exp,'proper reversal of exact decoration deltas');

 }
