<!doctype html>
<html lang="ja"><meta charset="utf-8">
<title>もんすたー日和 1.24.11 動作検証</title>
<h1>もんすたー日和 1.24.11 動作検証</h1>
<button id="run">検証を開始</button><pre id="result" aria-live="polite"></pre>
<script>
'use strict';
function ranchFixture(){
  const check=(condition,label)=>{if(!condition)throw Error(label)};
  function seed(){
    Object.assign(state,{speed:0,ranchName:'なよ牧場',coins:34567,food:191.5,magic:33,fame:127});
    state.monsters[1].shiny=true;addCatalogMonster(state.monsters[1]);state.party=[state.monsters[1].id];
    Object.assign(state.research,{farm:3,train:2,market:1,quest:4,battle:2,guest:1});
    state.treasures=[0,1];state.adventure.stage=7;state.adventure.clears=6;
    state.postcards[0]={count:3,day:1,sender:'旅人アン'};
    save(true);
  }
  function snapshot(){
    return JSON.stringify([state.ranchName,state.coins,state.food,state.magic,state.fame,state.day,state.hour,
      state.monsters.map(m=>[m.id,m.kind,m.lv,m.xp,m.shiny,m.trait,m.bond,m.energy]),state.restingMonsters,state.party,state.paths,
      state.staff.map(w=>[w.id,w.name,w.job,w.level]),state.buildings.map(b=>[b.id,b.type,b.level,b.x,b.y,b.facing]),
      state.research,state.adventure,state.catalog,state.treasures,state.materialStock211,state.postcards,state.zones]);
  }
  function research(){
    const cases=[
      ['farm',44,320,10],['train',52,340,10],['market',60,380,10],
      ['quest',66,420,10],['battle',96,660,5],['guest',68,460,8]
    ];
    const lab={type:'lab',id:state.nextId++,x:11,y:5,level:1};
    state.buildings.push(lab);tab='research';
    for(const [id,baseMagic,baseGold,percent] of cases){
      for(const level of [0,3]){
        state.research[id]=level;
        const magic=Math.round(baseMagic*1.6**level),gold=Math.round(baseGold*1.65**level);
        const button=()=>document.querySelector('[data-action="research"][data-id="'+id+'"]');
        for(const [coins,sparkles] of [[gold-1,magic],[gold,magic-1],[gold,magic]]){
          state.coins=coins;state.magic=sparkles;renderUI(true);
          const row=button().closest('.research-option'),affordable=coins===gold&&sparkles===magic;
          check(row.querySelector('.price').textContent===num(gold)+'G ＋ ✨'+num(magic),'quoted cost '+id);
          check(row.querySelector('.research-desc').textContent.includes('+'+percent+'% / Lv'),'quoted benefit '+id);
          check(button().disabled===!affordable,'affordability '+id);
          const expense=state.economy.expense,fame=state.fame;
          if(affordable)button().click();else doResearch(id);
          check(state.coins===coins-(affordable?gold:0)&&state.magic===sparkles-(affordable?magic:0),'payment '+id);
          check(state.research[id]===level+Number(affordable)&&state.economy.expense===expense+(affordable?gold:0),'ledger '+id);
          check(state.fame===fame+(affordable?2:0),'research fame '+id);
          check(researchMultiplier(id)===1+state.research[id]*percent/100,'applied benefit '+id);
        }
      }
    }
    state.research.farm=0;const plain=foodProduction.field(3);
    state.research.farm=3;check(Math.abs(foodProduction.field(3)/plain-1.3)<1e-8,'field yield');
  }
  function boss(){
    tab='adventure';state.battle=null;
    Object.assign(state.adventure,{stage:5,auto:false,bossLoop:null,cooldown:0});
    const launch=(action,stage)=>{renderUI(true);document.querySelector('[data-v192="'+action+'"][data-stage="'+stage+'"]').click();};
    function finish(stage,coins,silent=false){
      const b=state.battle;check(b?.stage===stage,'battle stage '+stage);
      const before=[state.coins,state.economy.income,state.metrics.coins],clears=state.adventure.clears,magic=state.magic;
      const xp=crewParty()[0].xp;
      b.foes.forEach(f=>f.hp=0);adventureTick(silent);
      check(!state.battle&&state.adventure.clears===clears+1,'cleared battle');
      check([state.coins,state.economy.income,state.metrics.coins].every((n,i)=>n-before[i]===coins),'gold credited '+stage);
      check(state.magic===magic+(b.boss?5:1)&&crewParty()[0].xp>xp,'non-gold rewards');
      const line=state.log.find(entry=>entry.msg.startsWith('🏆 '+stageLabel(stage)+' ')).msg;
      check(coins?line.endsWith('+'+coins+'G'):!line.includes('G'),'reward message '+line);
    }
    launch('fight',5);state.battle.ourHp=1;
    for(const f of state.battle.foes){f.hp=90000;f.atk=90000;}
    const purse=state.coins;adventureTick(false);
    check(!state.battle&&state.coins===purse&&state.adventure.stage===5,'loss before first victory');
    launch('fight',5);finish(5,330);check(state.adventure.stage===6,'first boss progress');
    launch('fight',5);finish(5,0);
    launch('loop',5);finish(5,0);
    for(let n=0;n<8&&!state.battle;n++)adventureTick(true);
    finish(5,0,true);
    check(save(true)&&load(),'reload active boss loop');
    for(let n=0;n<8&&!state.battle;n++)adventureTick(false);
    launch('loop',5);finish(5,0);check(state.adventure.bossLoop===null,'stopped loop');
    startAdventure();finish(6,Math.floor(86*1.48+6*14));
    state.adventure.stage=36;selectedBattleStage=31;startAdventure();finish(31,Math.floor(86*(1+6*.48)+31*14));
    state.adventure.stage=40;startAdventure();finish(40,Math.floor(260*(1+7*.48)+40*14));
  }
  function sleep(){
    state.hour=23;state.speed=1;state.day=1;state.battle=null;state.adventure.bossLoop=null;
    state.buildings=[];state.monsters=[];state.staff=[];state.guests=[];state.ponds=[];state.zones=[0,1,4,5];
    state.paths=[];state.clearedScenery=[];state.clearedPonds=[];state.removedDefaultPaths=[...DEFAULT_PATH_KEYS];
    for(let x=0;x<22;x++)for(let y=0;y<15;y++){
      const k=keyXY(x,y);state.paths.push(k);state.clearedScenery.push(k);state.clearedPonds.push(k);
    }
    const addSite=(type,x,y)=>{const b={type,x,y,id:state.nextId++,level:1,facing:0};state.buildings.push(b);return b;};
    let home=addSite('home',7,6),inn=addSite('inn',12,6);
    const nearDoor=b=>{const doors=entranceRoads(b);check(doors.length,'usable door '+b.type);return doors[0];};
    function arrive(m,b){
      const door=nearDoor(b);[m.x,m.y]=door;startFacilityVisit(m,b,{pt:door,path:[]});
      advanceFacilityVisit(m,.01);check(!m.indoorRest,'visible before entering');
      for(let i=0;i<80&&!m.indoorRest;i++)advanceFacilityVisit(m,.05);
      check(m.indoorRest?.buildingId===b.id&&m.act.includes('就寝'),'sleeping inside '+b.type);
    }
    function wake(m){
      for(let i=0;i<150&&monsterWalkTimer139(m).visit;i++)advanceFacilityVisit(m,.05);
      check(!m.indoorRest&&!plotWalks.has(m)&&residentRoad(Math.round(m.x),Math.round(m.y)),'returns to road');
    }
    function scene(scale){
      zoom=scale;cameraX=10-VW/(2*zoom);cameraY=7-VH/(2*zoom);
      const actors=[],roofs=[],drawActor=drawMapActor,drawBubble=drawMapBubble;
      drawMapActor=(o,...args)=>{actors.push(o);drawActor(o,...args);};
      drawMapBubble=(x,y,icon,now,id)=>{if(icon==='Zz')roofs.push({x,y,id});drawBubble(x,y,icon,now,id);};
      try{drawWorld(740);}finally{drawMapActor=drawActor;drawMapBubble=drawBubble;}
      return {actors,roofs,picked:mapPickItems.filter(item=>item.monster).map(item=>item.monster)};
    }
    let a=makeMonster(state.nextId++,0,8,8),b=makeMonster(state.nextId++,1,8,8);
    state.monsters=[a,b];state.party=[a.id];a.shiny=true;selectedMonster=a.id;
    for(const site of [home,inn])for(const side of [0,1,2,3]){
      site.facing=side;arrive(a,site);
      const view=scene(1);
      check(!view.actors.includes(a)&&!view.picked.includes(a)&&view.roofs.length===1&&view.roofs[0].id===site.id,'four facings '+site.type);
      wake(a);check(scene(1).actors.includes(a),'visible after waking');
    }
    home.facing=0;inn.facing=0;
    arrive(a,home);arrive(b,home);
    const door=nearDoor(inn);
    let traveler={name:'就寝の旅人',x:door[0],y:door[1],phase212:'sightseeing',visitBuildingId:inn.id,
      visitGoal:door,entered211:true,spent:17,life:90,bob:0,tx:door[0],ty:door[1],route212:[]};
    state.guests=[traveler];const coins=state.coins;
    for(let n=0;n<80&&!traveler.indoorRest;n++)animateGuest212(traveler,.05);
    check(traveler.indoorRest?.buildingId===inn.id&&state.coins===coins+17,'inn guest checks in once');
    for(const scale of [1,.42]){
      const v=scene(scale);
      check(v.roofs.length===2&&v.actors.length===0&&v.picked.length===0,'only two occupied roofs at '+scale);
      for(const site of [home,inn]){
        const rect=plotImageRect(site),roof=v.roofs.find(r=>r.id===site.id);
        check(roof&&roof.x===Math.round(rect.x+rect.w/2)&&roof.y<rect.y+rect.h/2,'roof location '+site.type);
      }
    }
    // The fallback map hit test also ignores a sleeping companion at the doorway.
    const cell=canvasCell,opened=openMonsterDetails;let hits=0;
    canvasCell=()=>({x:Math.round(a.x),y:Math.round(a.y),px:-9999,py:-9999});openMonsterDetails=()=>{hits++;};
    try{onMapClick({});}finally{canvasCell=cell;openMonsterDetails=opened;}
    check(hits===0,'no invisible map target');
    advanceFacilityVisit(a,.6);const left=a.indoorRest.remaining,guestLeft=traveler.indoorRest.remaining,paid=state.coins;
    state.speed=0;moveActorsOutOfWalls191();
    check(a.indoorRest&&b.indoorRest&&traveler.indoorRest,'unrelated construction leaves sleepers inside');
    check(save(true)&&load(),'sleep save reload');
    [a,b]=state.monsters;traveler=state.guests.find(g=>g.name==='就寝の旅人');
    home=state.buildings.find(x=>x.type==='home');inn=state.buildings.find(x=>x.type==='inn');
    check(a.indoorRest?.remaining===left&&traveler?.indoorRest?.remaining===guestLeft&&paid===state.coins,'sleep resumes without repeat payment');
    check(scene(1).roofs.length===2,'restored roofs');
    wake(a);check(scene(1).roofs.some(r=>r.id===home.id),'room still occupied by second sleeper');
    wake(b);check(!scene(1).roofs.some(r=>r.id===home.id),'last resident leaves');
    for(let n=0;n<150&&traveler.indoorRest;n++)animateGuest212(traveler,.05);
    check(!traveler.indoorRest&&scene(1).actors.includes(traveler)&&!scene(1).roofs.length&&state.coins===paid,'traveler wakes');
    const workDoor=nearDoor(home),worker=makeStaff(state.nextId++,'keeper',...workDoor);state.staff=[worker];
    stepPlotWalk(worker,home,workDoor,10,2);
    check(plotWalks.get(worker).phase==='use'&&!worker.indoorRest&&scene(1).actors.includes(worker),'keeper stays visible at work');
    cancelPlotWalk(worker);
    state.hour=12;arrive(a,home);home.facing=2;repairMovePaths212(home.id);advanceFacilityVisit(a,.05);
    check(!a.indoorRest&&residentRoad(Math.round(a.x),Math.round(a.y))&&scene(1).actors.includes(a),'rotating the occupied house');
    arrive(b,inn);state.buildings=state.buildings.filter(x=>x!==inn);repairMovePaths212(inn.id);advanceFacilityVisit(b,.05);
    check(!b.indoorRest&&scene(1).actors.includes(b)&&!scene(1).roofs.length,'removing the occupied inn');
    monsterWalkTimer139(a).pastime={kind:'nap',remaining:3};a.act='💤 お昼寝中';
    check(scene(1).actors.includes(a)&&!a.indoorRest,'outdoor nap remains visible');
    ctx.save();ctx.setTransform(1,0,0,1,0,0);drawMapBubble(32,32,'Zz',0,0);
    check([...ctx.getImageData(33,21,1,1).data].slice(0,3).join(',')==='65,77,118','pixel sleep icon');ctx.restore();
  }
  window.ranchQA={ready:()=>villageSheetReady&&facilitySheetReady,seed,snapshot,research,boss,sleep};
}
async function verify(width,previous,current){
  const prefix='qa12411_'+crypto.randomUUID()+'_',errors=[];let frame;
  async function open(html){
    frame?.remove();frame=document.createElement('iframe');frame.width=width;frame.height=width===390?844:900;
    const end='})();\n<\/script>';
    if(!html.includes(end))throw Error('missing game entry');
    frame.srcdoc=html.replaceAll('monster_biyori_',prefix).replace(end,()=> '('+ranchFixture.toString()+')();\n'+end);
    const ready=new Promise(resolve=>frame.onload=resolve);document.body.append(frame);await ready;
    frame.contentWindow.addEventListener('error',e=>errors.push(e.message));
    const qa=frame.contentWindow.ranchQA;
    for(let n=0;qa&&!qa.ready()&&n<200;n++)await new Promise(resolve=>setTimeout(resolve,30));
    if(!qa?.ready())throw Error('game or sprites failed to load');return qa;
  }
  try{
    let qa=await open(previous);qa.seed();qa=await open(previous);const legacy=qa.snapshot();
    qa=await open(current);
    if(!frame.contentDocument.title.includes('Ver.1.24.11'))throw Error('wrong game version');
    const currentSave=qa.snapshot(),before=JSON.parse(legacy),after=JSON.parse(currentSave);
    if(currentSave!==legacy){
      const i=before.findIndex((v,i)=>JSON.stringify(v)!==JSON.stringify(after[i]));
      throw Error('old save field '+i+' / '+JSON.stringify(before[i])+' / '+JSON.stringify(after[i]));
    }
    if(frame.contentDocument.documentElement.scrollWidth>frame.contentWindow.innerWidth+1)throw Error('layout width');
    qa.research();qa.boss();qa.sleep();
    if(errors.length)throw Error(errors.join(' / '));
    document.querySelector('#result').textContent+=width+'px 成功\n';
  }finally{
    frame?.remove();for(const k of Object.keys(localStorage))if(k.startsWith(prefix))localStorage.removeItem(k);
  }
}
document.querySelector('#run').onclick=async({currentTarget})=>{
  currentTarget.disabled=true;const output=document.querySelector('#result');output.textContent='';
  try{
    const pages=await Promise.all(['../releases/1.24.10/game.html','../releases/1.24.11/game.html'].map(async url=>{
      const response=await fetch(url);if(!response.ok)throw Error(url);return response.text();
    }));
    for(const width of [1366,390])await verify(width,...pages);
    output.textContent+='すべて成功';
  }catch(e){output.textContent+='失敗 '+e.stack;}
  finally{currentTarget.disabled=false;}
};
</script></html>
